name: Monitor stock

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede atrasarse unos minutos)
  workflow_dispatch:          # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write             # necesario para guardar estado.json en el repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Revisar stock
        run: python monitor_stock_gha.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Guardar estado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add estado.json
          git diff --staged --quiet || (git commit -m "actualizar estado" && git push)
